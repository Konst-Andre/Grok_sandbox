name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare PWA files for GitHub Pages
        run: |
          cp dist/client/_shell.html dist/client/index.html
          cp public/manifest.webmanifest dist/client/manifest.webmanifest

          # Виправляємо неправильні шляхи маніфесту/іконки
          sed -i 's|href="/__grok/manifest.webmanifest"|href="/Grok_sandbox/manifest.webmanifest"|g' dist/client/index.html
          sed -i 's|href="/__grok/icon-180.png"|href="/Grok_sandbox/__grok/icon-180.png"|g' dist/client/index.html

          # Додаємо apple-mobile-web-app-capable, якщо немає
          if ! grep -q 'apple-mobile-web-app-capable' dist/client/index.html; then
            sed -i 's|</head>|<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="Aurora">\n</head>|' dist/client/index.html
          fi

          echo "=== head tags ==="
          grep -E 'manifest|apple-touch|apple-mobile|theme-color' dist/client/index.html || true
          echo "=== manifest file ==="
          cat dist/client/manifest.webmanifest

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
