name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare site for GitHub Pages
        run: |
          set -e
          test -f dist/client/_shell.html
          cp dist/client/_shell.html dist/client/index.html
          cp public/manifest.webmanifest dist/client/manifest.webmanifest
          touch dist/client/.nojekyll

          python3 << 'PY'
          from pathlib import Path
          p = Path("dist/client/index.html")
          html = p.read_text(encoding="utf-8")
          html = html.replace('href="/__grok/manifest.webmanifest"', 'href="/Grok_sandbox/manifest.webmanifest"')
          html = html.replace('href="/__grok/icon-180.png"', 'href="/Grok_sandbox/__grok/icon-180.png"')
          if "apple-mobile-web-app-capable" not in html:
              html = html.replace(
                  "</head>",
                  '<meta name="apple-mobile-web-app-capable" content="yes">\n'
                  '<meta name="apple-mobile-web-app-title" content="Aurora">\n'
                  "</head>",
              )
          p.write_text(html, encoding="utf-8")
          assert "index.html" in str(p) and p.stat().st_size > 100
          print("index.html size:", p.stat().st_size)
          for line in html.splitlines():
              if any(k in line for k in ("manifest", "apple-touch", "apple-mobile", "theme-color")):
                  print(line)
          PY

          echo "=== dist/client listing ==="
          ls -la dist/client
          test -f dist/client/index.html
          test -f dist/client/manifest.webmanifest

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
