name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare PWA files for GitHub Pages
        run: |
          # SPA shell → index.html
          cp dist/client/_shell.html dist/client/index.html

          # Копіюємо маніфест (Vite міг його вже покласти, але на всяк випадок)
          cp public/manifest.webmanifest dist/client/manifest.webmanifest

          # Додаємо PWA-теги в <head>, якщо їх ще немає
          if ! grep -q 'rel="manifest"' dist/client/index.html; then
            sed -i 's|</head>|<link rel="manifest" href="/Grok_sandbox/manifest.webmanifest">\n<link rel="apple-touch-icon" href="/Grok_sandbox/__grok/icon-180.png">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="Aurora">\n<meta name="theme-color" content="#000000">\n</head>|' dist/client/index.html
          fi

          echo "=== dist/client ==="
          ls -la dist/client
          echo "=== manifest ==="
          cat dist/client/manifest.webmanifest

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
